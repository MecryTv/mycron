<!doctype html>
<html lang="de" data-v="A">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Entwurf: Vergleich im Abnahmedialog (W-0030)</title>
<style>/* eingebettet: board.css */
@font-face {
  font-family: "Geist";
  src: url("__FONT__") format("woff2");
  font-weight: 100 900;
  font-style: normal;
  font-display: swap;
}

:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --raised: #f8fafc;
  --sunken: #e9edf2;
  --line: #dce1e8;
  --line-strong: #c5cdd8;
  --text: #18202c;
  --text-2: #3f4a5c;
  --muted: #647085;
  --accent: #5550d9;
  --accent-soft: #e9e8fc;
  --on-accent: #ffffff;
  --danger: #d93a40;
  --ok: #1f9d6c;
  --warn: #c9860b;
  --p1: #e5484d; --p2: #ea7a2e; --p3: #3d7fe8; --p4: #8a95a8;
  --s-backlog: #8a95a8; --s-geplant: #3d7fe8; --s-in-arbeit: #e0a21c;
  --s-review: #9667e6; --s-erledigt: #22a874; --s-verworfen: #6a7689;
  --shadow-card: 0 1px 0 rgba(24, 32, 44, .04), 0 1px 3px rgba(24, 32, 44, .06);
  --shadow-pop: 0 18px 48px rgba(20, 26, 36, .18);
  --r-card: 10px;
  --r-ctrl: 8px;
  --font: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
:root[data-theme="dark"] { color-scheme: dark; }
:root[data-theme="light"] { color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141a24; --surface: #1c2330; --raised: #222b3a; --sunken: #10151e;
    --line: #2b3546; --line-strong: #3a475c; --text: #e6eaf2; --text-2: #c0c8d6; --muted: #8d98ab;
    --accent: #7f7bf6; --accent-soft: #2a2b4d; --on-accent: #10131c;
    --danger: #f0676c; --ok: #3dbe8b; --warn: #f2b33d;
    --p1: #f0676c; --p2: #f39a58; --p3: #6ea2f7; --p4: #8d98ab;
    --s-backlog: #8d98ab; --s-geplant: #6ea2f7; --s-in-arbeit: #f2b33d;
    --s-review: #b08af2; --s-erledigt: #3dbe8b; --s-verworfen: #6a7689;
    --shadow-card: 0 1px 0 rgba(0, 0, 0, .25);
    --shadow-pop: 0 18px 48px rgba(0, 0, 0, .5);
  }
}
:root[data-theme="dark"] {
  --bg: #141a24; --surface: #1c2330; --raised: #222b3a; --sunken: #10151e;
  --line: #2b3546; --line-strong: #3a475c; --text: #e6eaf2; --text-2: #c0c8d6; --muted: #8d98ab;
  --accent: #7f7bf6; --accent-soft: #2a2b4d; --on-accent: #10131c;
  --danger: #f0676c; --ok: #3dbe8b; --warn: #f2b33d;
  --p1: #f0676c; --p2: #f39a58; --p3: #6ea2f7; --p4: #8d98ab;
  --s-backlog: #8d98ab; --s-geplant: #6ea2f7; --s-in-arbeit: #f2b33d;
  --s-review: #b08af2; --s-erledigt: #3dbe8b; --s-verworfen: #6a7689;
  --shadow-card: 0 1px 0 rgba(0, 0, 0, .25);
  --shadow-pop: 0 18px 48px rgba(0, 0, 0, .5);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 14px/1.5 var(--font); font-feature-settings: "tnum" 0, "cv11" 1;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 16px; top: -40px; background: var(--accent); color: var(--on-accent); padding: 6px 10px; border-radius: var(--r-ctrl); z-index: 50; }
.skip:focus { top: 8px; }
.num { font-variant-numeric: tabular-nums; }
code, kbd { font-family: inherit; font-size: 12px; background: var(--sunken); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
kbd { color: var(--muted); border-bottom-width: 2px; }

/* Scrollbalken: schmal, in den Flächenfarben des Boards, Griff wird beim Überfahren kräftiger */
:root {
  --sb-thumb: color-mix(in srgb, var(--line-strong) 85%, transparent);
  --sb-thumb-hover: var(--muted);
  --sb-thumb-active: var(--accent);
}
::-webkit-scrollbar { width: 12px; height: 12px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb {
  background-color: var(--sb-thumb); border-radius: 999px;
  border: 3px solid transparent; background-clip: padding-box; min-height: 40px; min-width: 40px;
}
::-webkit-scrollbar-thumb:hover { background-color: var(--sb-thumb-hover); }
::-webkit-scrollbar-thumb:active { background-color: var(--sb-thumb-active); }
::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
/* Innenliegende Bereiche bekommen noch schmalere Balken */
.panel::-webkit-scrollbar, dialog::-webkit-scrollbar, .md pre::-webkit-scrollbar, textarea::-webkit-scrollbar { width: 10px; height: 10px; }
/* Das Board scrollt seitlich, dort liegt der Balken auf einer dezenten Schiene */
.board::-webkit-scrollbar-track { background: color-mix(in srgb, var(--sunken) 70%, transparent); border-radius: 999px; margin: 0 24px; }
/* Firefox kennt nur Breite und Farben. Chromium würde mit diesen Angaben die Regeln oben ignorieren. */
@supports not selector(::-webkit-scrollbar) {
  * { scrollbar-width: thin; scrollbar-color: var(--sb-thumb) transparent; }
  .board { scrollbar-color: var(--sb-thumb) color-mix(in srgb, var(--sunken) 70%, transparent); }
}

/* Kopfzeile */
.top {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 16px;
  padding: 12px 24px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.hub-link { font-size: 12.5px; font-weight: 500; color: var(--muted); text-decoration: none; white-space: nowrap; }
.hub-link:hover { color: var(--accent); }
h1 { font-size: 16px; font-weight: 650; margin: 0; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
h1 .dim { color: var(--muted); font-weight: 500; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
.live.off::before { background: var(--danger); box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 22%, transparent); }
.search { position: relative; flex: 1; max-width: 460px; margin-left: auto; }
.search input { width: 100%; height: 34px; padding: 0 34px 0 12px; border-radius: var(--r-ctrl); border: 1px solid var(--line); background: var(--surface); }
.search input::placeholder { color: var(--muted); }
.search kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); pointer-events: none; }
.actions { display: flex; gap: 6px; align-items: center; }

/* Knöpfe */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 12px;
  border-radius: var(--r-ctrl); border: 1px solid var(--line); background: var(--surface); cursor: pointer;
  font-weight: 500; white-space: nowrap; transition: background-color .15s, border-color .15s;
}
.btn:hover { border-color: var(--line-strong); background: var(--raised); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--text)); }
.btn.primary kbd { background: transparent; color: inherit; border-color: color-mix(in srgb, var(--on-accent) 40%, transparent); opacity: .8; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--sunken); border-color: transparent; color: var(--text); }
.btn.danger { color: var(--danger); }
.btn.small { height: 28px; padding: 0 10px; font-size: 13px; }
.btn.icon { width: 34px; padding: 0; }
.btn.icon svg { width: 17px; height: 17px; }
.btn.link { border: 0; background: none; color: var(--accent); padding: 0 4px; height: auto; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.count { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--on-accent); font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }

.readonly { margin: 12px 24px 0; padding: 10px 14px; border-radius: var(--r-ctrl); background: var(--accent-soft); color: var(--text-2); font-size: 13px; }

/* Überblick: Flussleiste */
.overview { padding: 18px 24px 4px; display: grid; gap: 10px; }
.flow { display: flex; gap: 3px; height: 40px; }
.flow .seg {
  --c: var(--s-backlog); position: relative; min-width: 72px; flex: var(--w) 1 0; display: flex; align-items: center; gap: 8px;
  padding: 0 12px; border: 0; border-radius: 6px; cursor: pointer; text-align: left; overflow: hidden;
  background: color-mix(in srgb, var(--c) 16%, var(--surface)); color: var(--text);
  transition: flex-grow .5s cubic-bezier(.2,.7,.2,1), background-color .2s;
}
.flow .seg::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--c); }
.flow .seg:hover { background: color-mix(in srgb, var(--c) 26%, var(--surface)); }
.flow .seg .n { font-size: 16px; font-weight: 650; font-variant-numeric: tabular-nums; }
.flow .seg .l { font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.flow .seg.zero { flex: 0 0 auto; min-width: 0; background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.flow .seg.zero::before { opacity: .5; }
.signals { display: flex; flex-wrap: wrap; gap: 6px; }
.signal {
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; border: 1px solid var(--line);
  background: var(--surface); font-size: 12px; color: var(--text-2); cursor: pointer;
}
.signal b { font-weight: 650; color: var(--text); font-variant-numeric: tabular-nums; }
.signal.hot { border-color: color-mix(in srgb, var(--danger) 45%, var(--line)); }
.signal.hot b { color: var(--danger); }
.signal.warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
.signal.warn b { color: var(--warn); }
.signal[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.signal.calm { cursor: default; }

/* Filter */
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 24px 6px; }
.prio-filter { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-ctrl); overflow: hidden; background: var(--surface); }
.prio-filter button { height: 30px; padding: 0 10px; border: 0; background: transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); }
.prio-filter button + button { border-left: 1px solid var(--line); }
.prio-filter button[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-strong); }
.prio-filter button[aria-pressed="false"] .pdot { opacity: .35; }
.filters select, .filters .btn.small { height: 32px; padding: 0 28px 0 10px; border-radius: var(--r-ctrl); border: 1px solid var(--line); background: var(--surface); }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); cursor: pointer; }
.pdot { width: 8px; height: 8px; border-radius: 2px; background: var(--pc, var(--p4)); display: inline-block; flex: none; }

/* Fortschritt */
.progress {
  display: grid; grid-template-columns: minmax(280px, 1.4fr) minmax(220px, 1fr) minmax(240px, 1fr); gap: 20px 28px; align-items: start;
  margin: 6px 24px 16px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
}
.pg-main { display: grid; gap: 10px; min-width: 0; }
.pg-head { display: flex; align-items: center; gap: 14px; }
.pg-pct { font-size: 34px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
.pg-pct small { font-size: 16px; font-weight: 600; color: var(--muted); margin-left: 2px; }
.pg-title { display: grid; gap: 1px; min-width: 0; }
.pg-title strong { font-size: 14px; font-weight: 650; }
.pg-title span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pg-bar { display: flex; gap: 2px; height: 10px; border-radius: 5px; overflow: hidden; background: var(--sunken); }
.pg-bar span { flex-basis: 0; min-width: 4px; transition: flex-grow .6s cubic-bezier(.2,.7,.2,1); }
.pg-done { background: var(--ok); }
.pg-work { background: color-mix(in srgb, var(--ok) 40%, var(--sunken)); }
.pg-wait { background: transparent; }
.pg-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; }
.pg-k { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
.pg-k i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.pg-k i.pg-wait { box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.pg-k b { font-weight: 650; color: var(--text); }
.pg-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; margin: 0; }
.pg-stats div { min-width: 0; }
.pg-stats dt { font-size: 12px; color: var(--muted); }
.pg-stats dd { margin: 2px 0 0; font-size: 14px; font-weight: 600; }
.pg-stats dd.late { color: var(--danger); }
.pg-chart { margin: 0; display: grid; gap: 4px; min-width: 0; }
.pg-chart figcaption { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
.pg-chart .lg { display: inline-flex; align-items: center; gap: 6px; }
.pg-chart .lg i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-left: 6px; }
.lg-done { background: var(--ok); }
.lg-total { background: var(--line-strong); }
.chart { width: 100%; height: 72px; display: block; overflow: visible; }
.c-grid { stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; }
.c-area { fill: color-mix(in srgb, var(--ok) 18%, transparent); }
.c-done { fill: none; stroke: var(--ok); stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.c-total { fill: none; stroke: var(--line-strong); stroke-width: 1.5; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; }
.c-dot { fill: var(--surface); stroke: var(--ok); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.c-axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }

/* Schnellsuche */
.palette { position: fixed; inset: 0; z-index: 70; background: rgba(10, 14, 20, .45); display: flex; justify-content: center; align-items: flex-start; padding: 12vh 16px 16px; }
.pal-box { width: min(640px, 100%); max-height: 70vh; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 14px; box-shadow: var(--shadow-pop); overflow: hidden; animation: palin .14s ease-out; }
@keyframes palin { from { opacity: 0; transform: translateY(-6px) scale(.99); } to { opacity: 1; transform: none; } }
.pal-head { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line); }
.pal-head svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.pal-head input { flex: 1; height: 52px; border: 0; background: transparent; font-size: 16px; outline: none; }
.pal-head input::placeholder { color: var(--muted); }
#palList { list-style: none; margin: 0; padding: 6px; overflow-y: auto; }
#palList li[role="option"] { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; min-width: 0; }
#palList li[aria-selected="true"] { background: var(--accent-soft); }
#palList li[aria-selected="true"] .pal-t { color: var(--text); }
#palList .pal-group { padding: 10px 10px 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
#palList .pal-empty { padding: 18px 12px; color: var(--muted); font-size: 13px; }
#palList .st { flex: none; }
.pal-id { color: var(--muted); font-weight: 600; flex: none; min-width: 56px; }
.pal-t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-2); }
.pal-m { font-size: 12px; color: var(--muted); flex: none; }
.pal-p { font-size: 12px; font-weight: 650; flex: none; min-width: 20px; text-align: right; }
.pal-ic { width: 18px; text-align: center; color: var(--muted); flex: none; font-weight: 600; }
#palList mark { background: transparent; color: var(--accent); font-weight: 650; }
.pal-foot { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.pal-foot .spacer { flex: 1; }

/* Board */
.board {
  display: grid; grid-auto-flow: column; grid-auto-columns: minmax(272px, 1fr); gap: 12px;
  padding: 0 24px 40px; overflow-x: auto; align-items: start; outline: none; scroll-snap-type: x proximity;
}
.col {
  --c: var(--s-backlog); min-width: 0; border-radius: 12px; background: color-mix(in srgb, var(--sunken) 60%, transparent);
  padding: 8px; scroll-snap-align: start; transition: background-color .2s, box-shadow .2s;
}
.col-head { display: flex; align-items: center; gap: 8px; padding: 4px 6px 10px; }
.col-head .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
.col-head h2 { font-size: 13px; font-weight: 600; margin: 0; }
.col-head .n { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; transition: transform .3s; display: inline-block; }
.col-head .add { margin-left: auto; width: 26px; height: 26px; border-radius: 6px; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; }
.col-head .add:hover { background: var(--surface); color: var(--text); }
.col-note { font-size: 12px; color: var(--warn); padding: 0 6px 8px; }
.col.arrive { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--c) 55%, transparent); }
.col.arrive .col-head .n { transform: scale(1.3); color: var(--text); }
.col.drop { background: color-mix(in srgb, var(--c) 14%, var(--sunken)); box-shadow: inset 0 0 0 2px var(--c); }
.col .empty { padding: 18px 10px; text-align: center; font-size: 12px; color: var(--muted); border: 1px dashed var(--line-strong); border-radius: var(--r-card); }
.cards { display: grid; gap: 8px; min-height: 8px; }
.quick { display: grid; gap: 6px; margin-bottom: 8px; }
.quick input { height: 36px; padding: 0 10px; border-radius: var(--r-ctrl); border: 1px solid var(--accent); background: var(--surface); }
.quick small { color: var(--muted); font-size: 11px; padding: 0 2px; }

/* Karten */
.card {
  --pc: var(--p4); position: relative; display: grid; gap: 6px; padding: 10px 12px; border-radius: var(--r-card);
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-card); cursor: pointer; text-align: left; width: 100%;
}
.card:hover { border-color: var(--line-strong); }
.card.dragging { opacity: .45; }
.card::before { content: ""; position: absolute; left: 10px; right: 10px; top: 0; height: 2px; border-radius: 0 0 2px 2px; background: var(--pc); }
.card[data-prio="P1"] { --pc: var(--p1); }
.card[data-prio="P2"] { --pc: var(--p2); }
.card[data-prio="P3"] { --pc: var(--p3); }
.card.closed { opacity: .8; }
.card.closed .title { color: var(--text-2); }
/* Etiketten an Karten: Stillstand (W-0013), gleiche Dateien (W-0012) */
.cflag { display: inline-flex; align-items: center; gap: 6px; justify-self: start; max-width: 100%; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 11.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cflag svg { width: 12px; height: 12px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.cflag.still { background: var(--sunken); color: var(--text-2); }
.cflag.conflict { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--text); }
.cflag.conflict svg { color: var(--warn); }
.card-top { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.card-top .id { font-weight: 600; color: var(--text-2); font-variant-numeric: tabular-nums; }
.card-top .prio { margin-left: auto; font-weight: 650; color: var(--pc); font-variant-numeric: tabular-nums; }
.effort { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 18px; padding: 0 5px; border-radius: 4px; background: var(--sunken); color: var(--text-2); font-size: 11px; font-weight: 600; }
.card .title { font-weight: 600; font-size: 14px; line-height: 1.35; color: var(--text); overflow-wrap: anywhere; }
.card img { width: 100%; height: 108px; object-fit: cover; object-position: top; border-radius: 6px; border: 1px solid var(--line); background: var(--sunken); }
.card-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12px; color: var(--muted); }
.card-meta .warn { color: var(--danger); font-weight: 500; }
.card-meta .note { color: var(--warn); }
.prog { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.prog .bar { width: 36px; height: 4px; border-radius: 2px; background: var(--sunken); overflow: hidden; }
.prog .bar span { display: block; height: 100%; background: var(--ok); }
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 10px; background: var(--sunken); color: var(--text-2); font-size: 11px; }
.tag.ms-tag { background: transparent; box-shadow: inset 0 0 0 1px var(--line-strong); }
.change {
  --cc: var(--accent); display: inline-flex; align-items: center; gap: 6px; justify-self: start; height: 20px; padding: 0 8px;
  border-radius: 10px; font-size: 11px; font-weight: 600; color: var(--cc); background: color-mix(in srgb, var(--cc) 16%, transparent);
}
.card.changed { border-color: color-mix(in srgb, var(--cc) 70%, var(--line)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--cc) 20%, transparent); }
.card.pulse { animation: pulse 1.2s ease-out 2; }
@keyframes pulse { from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--cc) 50%, transparent); } to { box-shadow: 0 0 0 10px transparent; } }

/* Detailpanel */
.scrim { position: fixed; inset: 0; background: rgba(10, 14, 20, .32); z-index: 29; }
.panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(680px, 100vw); z-index: 30; background: var(--surface);
  border-left: 1px solid var(--line); box-shadow: var(--shadow-pop); overflow-y: auto; overscroll-behavior: contain;
  animation: slidein .22s cubic-bezier(.2,.7,.2,1);
}
.panel.narrow { width: min(440px, 100vw); }
.panel:focus { outline: none; }
@keyframes slidein { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.panel-inner { padding: 20px 24px 40px; display: grid; gap: 22px; }
.p-head { display: grid; gap: 10px; position: sticky; top: -20px; padding-top: 20px; margin-top: -20px; background: var(--surface); z-index: 2; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.p-bar { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.p-bar .id { font-weight: 650; color: var(--text-2); font-variant-numeric: tabular-nums; }
.p-bar .spacer { flex: 1; }
.p-title { font-size: 20px; font-weight: 650; line-height: 1.3; letter-spacing: -.01em; margin: 0; padding: 2px 4px; margin-left: -4px; border: 1px solid transparent; border-radius: 6px; background: transparent; width: 100%; resize: none; overflow: hidden; }
.p-title:hover { border-color: var(--line); }
.p-title:focus { border-color: var(--accent); outline: none; background: var(--raised); }
.fields { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 12px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field.wide { grid-column: span 2; }
.field > span { font-size: 12px; color: var(--muted); }
.field select, .field input, .input, textarea.input {
  width: 100%; height: 34px; padding: 0 10px; border-radius: var(--r-ctrl); border: 1px solid var(--line); background: var(--raised);
}
textarea.input { height: auto; min-height: 96px; padding: 8px 10px; line-height: 1.5; resize: vertical; }
.field select:hover, .field input:hover, .input:hover { border-color: var(--line-strong); }
.alert { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--r-ctrl); font-size: 13px; background: var(--raised); border: 1px solid var(--line); color: var(--text-2); }
.alert.bad { border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); background: color-mix(in srgb, var(--danger) 7%, var(--surface)); }
.alert.info { border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); background: var(--accent-soft); }
.block { display: grid; gap: 10px; }
.block-head { display: flex; align-items: center; gap: 8px; }
.block-head h3 { font-size: 14px; font-weight: 650; margin: 0; }
.block-head .meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.block-head .spacer { flex: 1; }
.md { color: var(--text-2); font-size: 14px; line-height: 1.6; overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol, .md pre, .md table { margin: 0 0 8px; }
.md ul, .md ol { padding-left: 20px; }
.md h4, .md h5 { font-size: 13px; margin: 12px 0 4px; color: var(--text); }
.md pre { background: var(--sunken); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; overflow-x: auto; font-size: 12px; line-height: 1.5; white-space: pre; }
.md code { font-size: 12px; }
.md pre code { background: none; border: 0; padding: 0; }
.md table { border-collapse: collapse; font-size: 13px; width: 100%; }
.md th, .md td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
.md a { color: var(--accent); }
.md .empty-md { color: var(--muted); font-style: italic; }
.checklist { display: grid; gap: 2px; list-style: none; margin: 0; padding: 0; }
.checklist li { display: flex; align-items: flex-start; gap: 10px; padding: 6px 8px; border-radius: 6px; }
.checklist li:hover { background: var(--raised); }
.checklist input[type="checkbox"] { width: 16px; height: 16px; margin: 2px 0 0; accent-color: var(--ok); flex: none; cursor: pointer; }
.checklist .txt { flex: 1; overflow-wrap: anywhere; }
.checklist li.done .txt { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-strong); }
.checklist .rm { opacity: 0; border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 4px; font-size: 16px; line-height: 1; }
.checklist li:hover .rm, .checklist .rm:focus-visible { opacity: 1; }
.add-row { display: flex; gap: 6px; }
.add-row .input { flex: 1; }
.qa { display: grid; gap: 6px; padding: 10px 12px; border-radius: var(--r-ctrl); border: 1px solid var(--line); }
.qa.done { color: var(--muted); background: var(--raised); }
.qa .q { font-weight: 500; color: var(--text); }
.qa.done .q { color: var(--muted); text-decoration: line-through; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
.shot { display: grid; gap: 6px; font-size: 12px; color: var(--muted); }
.shot a { display: block; }
.shot img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; object-position: top; border-radius: 8px; border: 1px solid var(--line); background: var(--sunken); }
.shot .kind { display: inline-flex; height: 18px; align-items: center; padding: 0 6px; border-radius: 4px; background: var(--sunken); color: var(--text-2); font-weight: 600; font-size: 11px; margin-right: 6px; }
.drop {
  display: grid; gap: 10px; padding: 14px; border-radius: var(--r-card); border: 1.5px dashed var(--line-strong); background: var(--raised);
  font-size: 13px; color: var(--text-2); transition: border-color .15s, background-color .15s;
}
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop .row { display: flex; gap: 8px; flex-wrap: wrap; }
.drop .row > * { flex: 1 1 140px; }
.drop .preview { max-height: 140px; border-radius: 6px; border: 1px solid var(--line); justify-self: start; }
.rel { display: grid; gap: 6px; }
.rel-item { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); font-size: 13px; }
.rel-item .k { color: var(--muted); font-size: 12px; min-width: 92px; }
.rel-item button.go { border: 0; background: none; color: var(--text); cursor: pointer; padding: 0; text-align: left; flex: 1; }
.rel-item button.go:hover { color: var(--accent); }
.st { --c: var(--s-backlog); display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); white-space: nowrap; }
.st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; }
.timeline li { display: grid; grid-template-columns: 84px 1fr; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; }
.timeline li:first-child { border-top: 0; }
.timeline time { color: var(--muted); font-variant-numeric: tabular-nums; }
.timeline .by { display: inline-flex; margin-left: 6px; height: 18px; align-items: center; padding: 0 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 600; }
details.sec { border-top: 1px solid var(--line); padding-top: 12px; }
details.sec > summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 8px; }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary::before { content: ""; width: 6px; height: 6px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; }
details.sec[open] > summary::before { transform: rotate(45deg); }
details.sec > summary .meta { font-weight: 400; color: var(--muted); font-size: 12px; }
details.sec > .body { padding-top: 10px; display: grid; gap: 8px; }
.p-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-top: 1px solid var(--line); padding-top: 16px; }
.p-foot .path { font-size: 12px; color: var(--muted); margin-right: auto; overflow-wrap: anywhere; }
.stale { position: sticky; bottom: 12px; justify-self: center; }

/* Seitenleiste: Ideen, Aktivität, Nächste */
.side-head { display: flex; align-items: center; gap: 8px; }
.side-head h2 { font-size: 17px; font-weight: 650; margin: 0; }
.side-head .spacer { flex: 1; }
.idea { display: grid; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r-card); }
.idea .meta { font-size: 12px; color: var(--muted); }
.idea .row { display: flex; gap: 6px; flex-wrap: wrap; }
.idea .row select { flex: 1 1 120px !important; min-width: 0; }
.idea .row > button.btn:not(.ghost) { flex: 1 1 100%; }
.idea.closed { opacity: .7; }
.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.feed li { --cc: var(--muted); display: grid; gap: 2px; padding: 10px 12px; border-radius: 8px; cursor: pointer; }
.feed li .time { display: inline-flex; align-items: center; gap: 7px; }
.feed li .time::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--cc); flex: none; }
.feed li:hover { background: var(--raised); }
.feed .time { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.feed .why { font-size: 12px; color: var(--muted); }
.flowline { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.cand { display: grid; gap: 6px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r-card); }
.cand .t { font-weight: 600; }
.cand .why { font-size: 12px; color: var(--muted); }
.cand .row { display: flex; gap: 6px; align-items: center; }

/* Dialog */
dialog {
  width: min(600px, calc(100vw - 32px)); max-height: calc(100vh - 48px); padding: 0; border: 1px solid var(--line);
  border-radius: 14px; background: var(--surface); color: var(--text); box-shadow: var(--shadow-pop); overflow: auto;
}
dialog::backdrop { background: rgba(10, 14, 20, .45); }
dialog form { display: grid; gap: 16px; padding: 22px 24px; }
dialog h2 { font-size: 18px; font-weight: 650; margin: 0; }
dialog .lead { margin: -8px 0 0; color: var(--muted); font-size: 13px; }
dialog .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
dialog .span2 { grid-column: span 2; } dialog .span4 { grid-column: 1 / -1; }
dialog h2 { overflow-wrap: anywhere; }
/* flex-wrap: drei Knöpfe passen auf dem Handy nicht nebeneinander und zogen sonst das Formular über den Dialogrand (W-0021). */
dialog .foot { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; position: sticky; bottom: -22px; margin: 0 -24px -22px; padding: 12px 24px 18px; background: var(--surface); border-top: 1px solid var(--line); }
dialog .err { color: var(--danger); font-size: 13px; min-height: 0; }
.seg-ctl { display: flex; flex-wrap: wrap; gap: 4px; }
.seg-ctl label { position: relative; }
.seg-ctl input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.seg-ctl label > span { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--raised); font-size: 13px; color: var(--text-2); cursor: pointer; }
.seg-ctl input:checked + span { border-color: var(--accent); background: var(--accent-soft); color: var(--text); font-weight: 600; }
.seg-ctl input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.dod { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.dod li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 8px; background: var(--raised); font-size: 13px; }
.dod .mark { width: 18px; height: 18px; border-radius: 50%; flex: none; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; margin-top: 1px; }
.dod .ok .mark { background: color-mix(in srgb, var(--ok) 20%, transparent); color: var(--ok); }
.dod .no .mark { background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); }
.dod .detail { color: var(--muted); }
.dod label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; width: 100%; }
.dod input { width: 16px; height: 16px; margin: 1px 0 0; accent-color: var(--ok); flex: none; }
.sublabel { font-size: 12px; color: var(--muted); font-weight: 500; }

/* Hinweise */
.toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 60; width: min(380px, calc(100vw - 32px)); }
.toast {
  --cc: var(--accent); display: grid; gap: 2px; padding: 10px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line);
  border-top: 2px solid var(--cc); box-shadow: var(--shadow-pop); font-size: 13px; cursor: pointer; animation: tin .22s ease-out;
}
.toast.err { --cc: var(--danger); }
.toast .what { font-weight: 600; }
.toast .why { color: var(--muted); font-size: 12px; }
.toast.out { opacity: 0; transform: translateY(6px); transition: opacity .25s, transform .25s; }
@keyframes tin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Ansichten umschalten */
.views { overflow-x: auto; overflow-y: hidden; max-width: 100%; display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-ctrl); background: var(--surface); flex: none; scrollbar-width: none; }
.views::-webkit-scrollbar { display: none; }
.views button { height: 32px; padding: 0 12px; border: 0; background: transparent; color: var(--text-2); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; }
.views button + button { border-left: 1px solid var(--line); }
.views button:hover { background: var(--raised); color: var(--text); }
.views button[aria-pressed="true"] { background: var(--accent-soft); color: var(--text); font-weight: 600; }
.views .count { height: 16px; min-width: 16px; font-size: 10px; }
.view { padding: 18px 24px 48px; outline: none; }
.muted { color: var(--muted); }
.mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; font-size: 12.5px; }
.tag.q-tag { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

/* Nur-Lesen: Bearbeitungselemente ausblenden */
.ro [data-edit], .ro .add-row, .ro .checklist .rm, .ro .drop, .ro [data-act], .ro [data-unlink], .ro [data-start],
.ro .idea .row, .ro #ideaTags, .ro .col-head .add { display: none !important; }
.ro .p-title { cursor: default; }
.ro .p-title:hover { border-color: transparent; }
.ro select:disabled, .ro input:disabled { opacity: 1; cursor: default; color: var(--text); }
.ro-val { display: flex; align-items: center; min-height: 34px; font-weight: 500; overflow-wrap: anywhere; }

/* Warteschlange */
.q-wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
.q-main { flex: 999 1 560px; min-width: 0; display: grid; gap: 10px; }
.q-side { flex: 1 1 290px; min-width: 0; display: grid; gap: 10px; position: sticky; top: 76px; }
.q-head h2 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
.q-head p { margin: 2px 0 6px; color: var(--muted); }
.q-side h3 { margin: 4px 0 2px; font-size: 15px; }
.q-running { --c: var(--s-in-arbeit); display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line-strong); text-align: left; cursor: pointer; width: 100%; }
.q-running:hover { border-color: var(--c); }
.q-run-ic { width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex: none; font-size: 11px; color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); }
.q-running small { display: block; color: var(--c); font-weight: 600; font-size: 12px; }
.q-t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.q-t strong { font-weight: 600; }
.q-list { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 8px; counter-reset: q; }
.q-item { position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-card); transition: border-color .15s, box-shadow .15s, opacity .15s; }
.q-item.is-next { border-color: var(--accent); }
.q-item.is-blocked { background: color-mix(in srgb, var(--surface) 70%, var(--sunken)); }
.q-item[draggable="true"] { cursor: grab; }
.q-item.dragging { opacity: .45; }
.q-item.before::before, .q-item.after::after { content: ""; position: absolute; left: 8px; right: 8px; height: 3px; border-radius: 2px; background: var(--accent); }
.q-item.before::before { top: -6px; }
.q-item.after::after { bottom: -6px; }
.grip { color: var(--muted); letter-spacing: -2px; user-select: none; }
.q-pos { width: 22px; font-weight: 700; color: var(--text-2); text-align: center; flex: none; }
.q-item.is-next .q-pos { color: var(--accent); }
.q-title { border: 0; background: none; padding: 0; text-align: left; cursor: pointer; font-weight: 600; color: var(--text); overflow-wrap: anywhere; }
.q-title:hover { color: var(--accent); }
.q-title .id { color: var(--muted); font-weight: 600; margin-right: 2px; }
.q-meta { font-size: 12px; color: var(--muted); }
.q-prio { font-size: 12px; font-weight: 650; flex: none; }
.q-hint { font-size: 12px; color: var(--muted); white-space: nowrap; flex: none; }
.q-hint.bad { color: var(--danger); }
.q-hint.good { color: var(--accent); }
.q-ctl { display: inline-flex; gap: 2px; flex: none; }
.q-ctl .btn.icon { width: 28px; }
.q-empty { display: grid; gap: 4px; padding: 22px; border-radius: 12px; border: 1.5px dashed var(--line-strong); color: var(--muted); text-align: center; }
.q-empty strong { color: var(--text); }
.q-add { display: flex; gap: 8px; margin-top: 4px; }
.q-add select { flex: 1; min-width: 0; height: 36px; border-radius: var(--r-ctrl); border: 1px solid var(--line); background: var(--surface); padding: 0 10px; }
.q-card { display: grid; gap: 4px; padding: 12px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; color: var(--text-2); }
.q-card small { color: var(--muted); font-size: 12px; }
.q-card.row { display: flex; justify-content: space-between; gap: 12px; }
.q-card .q-title { font-weight: 600; }
.q-card q { quotes: "„" "“"; color: var(--text); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); cursor: pointer; }
.switch > span { display: grid; gap: 1px; }
.switch b { font-weight: 550; font-size: 13.5px; }
.switch small { color: var(--muted); font-size: 12px; }
.switch.off { opacity: .55; cursor: default; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch i { flex: none; width: 34px; height: 20px; border-radius: 10px; background: var(--line-strong); position: relative; transition: background-color .2s; }
.switch i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); transition: transform .2s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.switch input:checked + i { background: var(--accent); }
.switch input:checked + i::after { transform: translateX(14px); }
.switch input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Zeitleiste */
.tl-view { --lab: 300px; }
.tl-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.tl { position: relative; }
.tl-headrow { display: grid; grid-template-columns: var(--lab) 1fr; position: sticky; top: 0; z-index: 3; background: var(--surface); border-bottom: 1px solid var(--line); }
.tl-corner { padding: 10px 14px; font-size: 12px; color: var(--muted); }
.tl-weeks { display: grid; grid-template-columns: repeat(var(--weeks), minmax(0, 1fr)); }
.tl-wk { padding: 8px 10px; border-left: 1px solid var(--line); display: grid; font-size: 12px; color: var(--muted); line-height: 1.3; }
.tl-wk b { font-weight: 600; color: var(--text-2); }
.tl-wk.cur { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.tl-wk.cur b { color: var(--accent); }
.tl-body { position: relative; padding-bottom: 8px; }
.tl-grid { position: absolute; inset: 0 0 0 var(--lab); display: grid; grid-template-columns: repeat(var(--weeks), minmax(0, 1fr)); pointer-events: none; }
.tl-grid i { border-left: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
.tl-grid i.cur { background: color-mix(in srgb, var(--accent) 5%, transparent); }
.tl-today { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--accent); z-index: 2; pointer-events: none; }
.tl-today::before { content: "heute"; position: absolute; top: 4px; left: 5px; font-size: 10.5px; font-weight: 600; color: var(--accent); }
.tl-group { position: relative; }
.tl-ghead { display: flex; align-items: baseline; gap: 10px; padding: 14px 14px 6px; border-top: 1px solid var(--line); position: relative; z-index: 1; }
.tl-group:first-of-type .tl-ghead { border-top: 0; padding-top: 22px; }
.tl-ghead span { font-size: 12px; color: var(--muted); }
.tl-ms { position: absolute; top: 8px; bottom: 0; width: 0; border-left: 2px dashed var(--ok); z-index: 1; pointer-events: none; }
.tl-row { display: grid; grid-template-columns: var(--lab) 1fr; align-items: center; min-height: 36px; position: relative; z-index: 1; }
.tl-row:hover { background: color-mix(in srgb, var(--raised) 70%, transparent); }
.tl-label { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 6px 14px; border: 0; background: none; text-align: left; cursor: pointer; font-size: 13px; color: var(--text); }
.tl-label .id { color: var(--muted); font-weight: 600; flex: none; }
.tl-label .tt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl-label:hover .tt { color: var(--accent); }
.tl-row.is-done .tl-label .tt { color: var(--muted); }
.tl-track { position: relative; height: 28px; }
.tl-bar { --c: var(--s-backlog); position: absolute; top: 3px; height: 22px; border-radius: 6px; font-size: 11.5px; font-weight: 600; display: flex; align-items: center; padding: 0 8px; white-space: nowrap; overflow: hidden; cursor: pointer; box-sizing: border-box; }
.tl-bar span { overflow: hidden; text-overflow: ellipsis; }
.tl-bar.k-run { background: var(--c); color: #10131c; }
.tl-bar.k-done { background: color-mix(in srgb, var(--s-erledigt) 30%, var(--surface)); color: var(--text-2); }
.tl-bar.k-plan { border: 1.5px dashed var(--c); color: var(--c); background: color-mix(in srgb, var(--c) 8%, transparent); }
.tl-bar.k-est { border: 1.5px dashed var(--line-strong); color: var(--text-2); background: transparent; font-weight: 500; }
.tl-bar.k-late { background: color-mix(in srgb, var(--danger) 16%, transparent); border: 1.5px solid var(--danger); color: var(--danger); }
.tl-bar.resizing { box-shadow: 0 0 0 2px var(--accent); }
.tl-handle { position: absolute; right: 0; top: 0; bottom: 0; width: 10px; cursor: ew-resize; touch-action: none; }
.tl-handle::after { content: ""; position: absolute; right: 3px; top: 5px; bottom: 5px; width: 2px; border-radius: 1px; background: currentColor; opacity: 0; transition: opacity .15s; }
.tl-bar:hover .tl-handle::after, .tl-bar.resizing .tl-handle::after { opacity: .7; }
.tl-wait { position: absolute; top: 7px; font-size: 11.5px; color: var(--danger); white-space: nowrap; pointer-events: none; }
.tl-empty { padding: 32px; text-align: center; color: var(--muted); }
.tl-legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 12px; font-size: 12px; color: var(--muted); }
.tl-legend span { display: inline-flex; align-items: center; gap: 6px; }
.tl-legend i { display: inline-block; width: 16px; height: 10px; border-radius: 3px; }
.lg-today { width: 2px !important; height: 12px !important; background: var(--accent); }
.lg-ms { width: 0 !important; height: 12px !important; border-left: 2px dashed var(--ok); border-radius: 0 !important; }
.lg-run { background: var(--s-in-arbeit); }
.lg-plan { border: 1.5px dashed var(--s-geplant); }
.lg-est { border: 1.5px dashed var(--line-strong); }

/* Tabelle */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl thead th { position: sticky; top: 0; background: var(--raised); text-align: left; font-weight: 600; border-bottom: 1px solid var(--line); white-space: nowrap; padding: 0; z-index: 1; }
.tbl thead th button { width: 100%; height: 36px; padding: 0 10px; border: 0; background: none; text-align: left; cursor: pointer; font-weight: 600; color: var(--text-2); font-size: 12px; }
.tbl thead th button:hover { color: var(--text); }
.tbl thead th button[aria-sort="ascending"], .tbl thead th button[aria-sort="descending"] { color: var(--accent); }
.tbl td { padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl tbody tr:hover { background: var(--raised); }
.tbl tbody tr.sel { background: var(--accent-soft); }
.tbl tbody tr.closed td { color: var(--muted); }
.tbl .c-sel { width: 36px; text-align: center; padding: 0 0 0 6px; }
.tbl .c-sel input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
.tbl .c-id { color: var(--muted); font-weight: 600; }
.tbl .c-title { white-space: normal; min-width: 260px; }
.tbl .c-title .tt { border: 0; background: none; padding: 0; text-align: left; cursor: pointer; color: var(--text); font-weight: 500; }
.tbl tr.closed .c-title .tt { color: var(--muted); }
.tbl .c-title .tt:hover { color: var(--accent); }
.tbl .c-title .warn, .tbl .c-title .tag { margin-left: 8px; font-size: 11px; }
.tbl .c-title .warn { color: var(--danger); }
.tbl .c-tags { white-space: normal; }
.tbl .c-tags .tag { margin: 1px 4px 1px 0; }
.tbl td.late { color: var(--danger); }
.tbl .cell { height: 28px; border: 1px solid transparent; border-radius: 6px; background: transparent; padding: 0 4px; cursor: pointer; font-weight: 600; }
.tbl input.cell { font-weight: 400; }
.tbl .cell:hover, .tbl .cell:focus { border-color: var(--line-strong); background: var(--surface); }
.tbl-empty { text-align: center; color: var(--muted); padding: 28px !important; }
.tbl-foot { font-size: 12px; color: var(--muted); margin: 10px 2px 0; }
.bulk {
  position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 30; display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  padding: 8px 10px 8px 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line-strong); box-shadow: var(--shadow-pop);
  max-width: calc(100vw - 32px); animation: tin .18s ease-out;
}
.bulk strong { margin-right: 6px; font-size: 13px; }
.bulk select.input { width: auto; height: 28px; font-size: 13px; padding: 0 6px; background: var(--raised); }

/* Detailpanel: Tabs und Code */
.p-tabs { display: flex; gap: 2px; margin-bottom: -13px; }
.p-tabs button { border: 0; background: none; padding: 8px 12px; cursor: pointer; color: var(--text-2); font-size: 13px; border-bottom: 2px solid transparent; }
.p-tabs button:hover { color: var(--text); }
.p-tabs button[aria-selected="true"] { color: var(--text); font-weight: 600; border-bottom-color: var(--accent); }
.code-box { display: grid; gap: 20px; }
.code-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.code-cards > div { padding: 10px 14px; border-radius: 10px; background: var(--raised); border: 1px solid var(--line); display: grid; gap: 2px; min-width: 0; }
.code-cards small { color: var(--muted); font-size: 12px; }
.code-cards strong { font-weight: 600; overflow-wrap: anywhere; }
.code-cards a { color: var(--accent); }
.commits { list-style: none; margin: 0; padding: 0; display: grid; }
.commits li { display: flex; gap: 12px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; }
.commits li:first-child { border-top: 0; }
.commits .hash { color: var(--accent); flex: none; }
.commits .subj { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.files { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.files li + li { border-top: 1px solid var(--line); }
.files .file { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 0; background: var(--surface); cursor: pointer; text-align: left; font-size: 13px; }
.files .file:hover, .files .file[aria-expanded="true"] { background: var(--raised); }
.files .fn { flex: 1; min-width: 0; overflow-wrap: anywhere; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; }
.files .add { color: var(--ok); font-size: 12px; }
.files .del { color: var(--danger); font-size: 12px; }
.diff { border-top: 1px solid var(--line); background: var(--sunken); overflow-x: auto; }
.diff-body { padding: 6px 0; line-height: 1.6; min-width: max-content; }
.dl { padding: 0 12px; white-space: pre; }
.dl.da { background: color-mix(in srgb, var(--ok) 13%, transparent); color: color-mix(in srgb, var(--ok) 70%, var(--text)); }
.dl.dd { background: color-mix(in srgb, var(--danger) 12%, transparent); color: color-mix(in srgb, var(--danger) 70%, var(--text)); }
.dl.dh { color: var(--muted); padding-top: 4px; }
.dl.dc { color: var(--accent); font-weight: 600; padding-top: 8px; }
.diff-more, .diff .err { padding: 6px 12px; margin: 0; font-size: 12px; }

/* Teilen */
.share-link { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; }
.share-link > span { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
.share-link .input { font-size: 12px; }
.share-link.warn .input { border-color: color-mix(in srgb, var(--danger) 45%, var(--line)); }
.row-btns { display: flex; flex-wrap: wrap; gap: 8px; }

/* Gespeicherte Ansichten */
.saved-views { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 2px 24px 8px; }
.sv-label { font-size: 12px; color: var(--muted); margin-right: 4px; }
.sv-wrap { display: inline-flex; align-items: center; position: relative; }
.sv-chip { height: 28px; padding: 0 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--text-2); cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.sv-chip:hover { border-color: var(--line-strong); color: var(--text); }
.sv-chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--text); font-weight: 600; }
.sv-chip.add { border-style: dashed; color: var(--accent); background: transparent; }
.sv-n { font-size: 11px; color: var(--muted); }
.sv-x { width: 20px; height: 20px; margin-left: -4px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer; opacity: 0; font-size: 14px; line-height: 1; }
.sv-wrap:hover .sv-x, .sv-x:focus-visible { opacity: 1; }
.sv-x:hover { color: var(--danger); background: var(--sunken); }
.good { color: var(--ok); }
.late { color: var(--danger); }

/* Sprint */
.sp { max-width: 1240px; margin: 0 auto; display: grid; gap: 18px; }
.sp-top { display: flex; flex-wrap: wrap; gap: 16px; }
.sp-card { padding: 16px 18px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); display: grid; gap: 10px; align-content: start; min-width: 0; }
.sp-main { flex: 2 1 460px; }
.sp-burn { flex: 1 1 300px; }
.sp-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; }
.sp-head h2 { margin: 0; font-size: 20px; letter-spacing: -.01em; }
.sp-head .spacer { flex: 1; }
.sp-goal { margin: -4px 0 0; color: var(--text-2); }
.sp-cap { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
.sp-bar { height: 12px; }
.sp-open, .pg-legend i.sp-open { background: var(--s-geplant); }
.sp-h { margin: 0 0 4px; font-size: 15px; display: flex; gap: 8px; align-items: baseline; }
.sp-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.sp-item { display: flex; align-items: center; gap: 12px; padding: 9px 12px 9px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; }
.sp-item .q-title { flex: 1; min-width: 0; }
.sp-item.done .q-title { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-strong); }
.sp-item .st::before { width: 8px; height: 8px; }
.sp-drop { padding: 14px; border-radius: 10px; border: 1.5px dashed var(--line-strong); color: var(--muted); text-align: center; font-size: 13px; margin-top: 6px; transition: border-color .15s, background-color .15s; }
.sp-drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
.sp-cand { position: relative; display: grid; gap: 2px; padding: 10px 44px 10px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); cursor: grab; }
.sp-cand.best { border-color: var(--accent); }
.sp-cand.dragging { opacity: .45; }
.sp-cand .sp-add { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); }
.sp-form { display: grid; gap: 12px; padding: 16px 18px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.sp-form .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 12px; }
.sp-form .span2 { grid-column: span 2; }
.chart .c-ideal { fill: none; stroke: var(--line-strong); stroke-width: 1.5; stroke-dasharray: 4 4; vector-effect: non-scaling-stroke; }

/* Abhängigkeitsgraph */
.gr-bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 13px; }
.gr-scroll { overflow: auto; max-height: calc(100vh - 220px); border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.gr-canvas { position: relative; }
.gr-svg { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.gr-edge { fill: none; stroke: var(--line-strong); stroke-width: 2; }
.gr-edge.done { stroke-dasharray: 5 4; opacity: .7; }
.gr-edge.hot { stroke: var(--p2); stroke-width: 3; }
.gr-edge.tmp { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 4; }
.gr-ah { fill: var(--line-strong); }
.gr-ah.hot { fill: var(--p2); }
.gr-node { position: absolute; box-sizing: border-box; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--raised); box-shadow: var(--shadow-card); }
.gr-node.crit { border: 2px solid var(--p2); }
.gr-node.done { opacity: .65; }
.gr-node.target { box-shadow: 0 0 0 3px var(--accent); }
.gr-open { width: 100%; height: 100%; border: 0; background: none; padding: 8px 12px; text-align: left; cursor: pointer; display: flex; flex-direction: column; justify-content: center; gap: 2px; color: var(--text); }
.gr-meta { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
.gr-node.blocked .gr-meta { color: var(--danger); }
.gr-node.done .gr-t { text-decoration: line-through; color: var(--muted); }
.gr-t { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gr-link { position: absolute; right: -11px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line-strong); background: var(--surface); color: var(--accent); cursor: crosshair; font-weight: 700; line-height: 1; padding: 0; opacity: 0; transition: opacity .15s; touch-action: none; }
.gr-node:hover .gr-link, .gr-link:focus-visible { opacity: 1; }
.q-card.crit { border-color: var(--p2); }
.gr-legend { display: grid; gap: 6px; font-size: 13px; }
.gr-legend span { display: inline-flex; align-items: center; gap: 8px; }
.lg-hot, .lg-edge { display: inline-block; width: 22px; height: 3px; border-radius: 2px; background: var(--p2); }
.lg-edge { height: 2px; background: var(--line-strong); }

/* Kommentare und Zeit */
.p-tabs .count { height: 16px; min-width: 16px; font-size: 10px; margin-left: 4px; }
.comments, .time-box { display: grid; gap: 14px; }
.cm-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.cm { display: flex; gap: 12px; }
.cm-av { width: 30px; height: 30px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; flex: none; background: var(--accent-soft); color: var(--accent); }
.cm.cl .cm-av { background: color-mix(in srgb, var(--s-in-arbeit) 18%, transparent); color: var(--s-in-arbeit); }
.cm-b { flex: 1; min-width: 0; display: grid; gap: 4px; }
.cm-meta { font-size: 12px; color: var(--muted); }
.cm-meta strong { color: var(--text); }
.cm-text { padding: 10px 14px; border-radius: 4px 12px 12px 12px; background: var(--raised); border: 1px solid var(--line); }
.cm-compose { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
.est { margin-bottom: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 10px 14px; }
.est > summary { cursor: pointer; font-weight: 600; display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.est > summary .meta { font-weight: 400; font-size: 12px; color: var(--muted); }
.est-body { display: grid; gap: 10px; padding-top: 12px; }
.est-grid { display: grid; grid-template-columns: 36px minmax(0, 1fr) minmax(140px, auto); gap: 10px 12px; align-items: center; font-size: 13px; max-width: 760px; }
.est-track { position: relative; height: 16px; border-radius: 4px; background: var(--sunken); }
.est-bar { position: absolute; left: 0; top: 3px; bottom: 3px; border-radius: 3px; background: var(--s-geplant); }
.est-bar.over { background: var(--p2); }
.est-mark { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--text); }

/* Prüfungen */
.checks { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.ck + .ck { border-top: 1px solid var(--line); }
.ck { padding: 9px 12px; display: grid; gap: 8px; }
.ck.warn { background: color-mix(in srgb, var(--warn) 7%, transparent); }
.ck.bad { background: color-mix(in srgb, var(--danger) 7%, transparent); }
.ck-row { display: flex; align-items: center; gap: 10px; font-size: 13px; min-width: 0; }
.ck-ic { width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex: none; background: var(--sunken); color: var(--muted); }
.ck.ok .ck-ic { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.ck.warn .ck-ic { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
.ck.bad .ck-ic { background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); }
.ck.running .ck-ic { border: 2px solid var(--accent); border-right-color: transparent; background: none; color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.ck-name { font-weight: 600; }
.ck-cmd { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ck-ms { flex: none; font-size: 12px; }
.ck-note { margin-left: 30px; font-size: 13px; display: grid; gap: 8px; }
.ck-out { margin-left: 30px; font-size: 12px; }
.ck-out pre { margin: 6px 0 0; max-height: 220px; overflow: auto; padding: 8px 10px; border-radius: 6px; background: var(--sunken); white-space: pre-wrap; }
.ck-edit .input { height: 32px; }
/* Prüfung bearbeiten: oben Name, Ordner, Entfernen, darunter der Befehl in voller Breite */
.ck-edit { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 130px) auto; gap: 6px; }
.ck-edit [data-ckk] { grid-column: 1; grid-row: 1; }
.ck-edit [data-ckd] { grid-column: 2; grid-row: 1; }
.ck-edit [data-ckrm] { grid-column: 3; grid-row: 1; }
.ck-edit [data-ckv] { grid-column: 1 / -1; grid-row: 2; }
.ck-edit + .ck-edit { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }

/* Werkzeuge, Vorlagen */
.switch.small { padding: 8px 12px; }
.switch.small b { font-size: 13px; }
#repSet { display: grid; gap: 8px; }
.rep-list { list-style: none; margin: 0; padding: 0; display: grid; }
.rep-list li { display: flex; gap: 12px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); font-size: 13px; }
.rep-list li span { flex: 1; }
.rep-list a { color: var(--accent); }
.tpl-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
.tpl-row:first-child { border-top: 0; }
dialog:has(.tp), dialog:has(#teFields) { width: min(920px, calc(100vw - 24px)); }
.tp { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
.tp-list { flex: 1 1 220px; display: grid; gap: 6px; min-width: 0; }
.tp-item { display: grid; gap: 1px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--raised); color: var(--text); text-align: left; cursor: pointer; font-weight: 550; }
.tp-item span { font-size: 12px; color: var(--muted); font-weight: 400; }
.tp-item[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.tp-item.new { border-style: dashed; color: var(--accent); background: transparent; text-align: center; }
.tp-pane { flex: 999 1 420px; min-width: 0; display: grid; gap: 12px; }
.tp-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tp-pane .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 12px; }
.tp-pane .span2 { grid-column: span 2; }

/* ---------- Runde 3 ---------- */

/* Gemeinsam: Dialog im Fluss der Seite gezeigt, breiter als heute (600 px) */
.ew-stage { min-height: 100vh; background: rgba(10, 14, 20, .45); padding: 28px 16px; }
.ew-stage dialog { position: static; display: block; margin: 0 auto; width: min(1120px, 100%); max-height: none; }
.ew-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; }
.ew-grp { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ew-grp > span { font-size: 12px; color: var(--text-2); margin-right: 2px; }
.ew-stage .rv-cmp { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.ew-stage .rv-img { aspect-ratio: auto; max-height: 520px; }
.ew-stage .rv-fig figcaption { color: var(--text-2); }
.ew-narrow .rv-img { max-width: 300px; margin: 0 auto; display: block; }
.ew-miss { display: grid; place-items: center; gap: 6px; min-height: 220px; padding: 16px; border: 1px dashed var(--line-strong); border-radius: 8px; color: var(--text-2); font-size: 13px; text-align: center; }
.ew-miss code { font-size: 12px; overflow-wrap: anywhere; }
@media (max-width: 640px) { .ew-stage .rv-cmp { grid-template-columns: minmax(0, 1fr); } }

/* Rahmen des Entwurfs, nicht Teil des Designs */
.ew-frame { position: sticky; top: 0; z-index: 2147483000; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 16px; font: 13px/1.45 system-ui, sans-serif; background: #fff6cc; color: #3d3200; border-bottom: 1px dashed #a88a00; }
:root[data-theme="dark"] .ew-frame { background: #2a2400; color: #f5e9a8; border-color: #8a7300; }
.ew-frame b { font-weight: 600; }
.ew-seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border: 1px solid currentColor; border-radius: 9px; }
.ew-seg button { font: inherit; color: inherit; background: none; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.ew-seg button[aria-pressed="true"] { background: #3d3200; color: #fff6cc; }
:root[data-theme="dark"] .ew-seg button[aria-pressed="true"] { background: #f5e9a8; color: #2a2400; }
.ew-seg button:focus-visible { outline: 2px solid currentColor; outline-offset: 1px; }
.ew-note { flex-basis: 100%; margin: 0; }
.ew-note:empty { display: none; }
:root[data-frame="0"] .ew-frame { display: none; }
</style>

<script>
(() => {
  const q = new URLSearchParams(location.search);
  const root = document.documentElement;
  const parts = [...document.querySelectorAll('[data-ew-variant]')];
  let v = q.get('v') || root.dataset.v || (parts[0] && parts[0].dataset.ewVariant);
  let theme = q.get('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  if (q.get('frame') === '0') root.dataset.frame = '0';
  const seg = document.getElementById('ew-variants');
  for (const p of parts) {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.ewV = p.dataset.ewVariant;
    b.textContent = p.dataset.ewVariant;
    seg.append(b);
  }
  function render() {
    root.dataset.v = v;
    root.dataset.theme = theme;
    for (const p of parts) p.style.display = p.dataset.ewVariant === v ? '' : 'none';
    document.querySelectorAll('[data-ew-v]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.ewV === v)));
    document.querySelectorAll('[data-ew-theme]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.ewTheme === theme)));
    const cur = parts.find((p) => p.dataset.ewVariant === v);
    document.getElementById('ew-note').textContent = cur ? cur.dataset.ewNote || '' : '';
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-ew-v], [data-ew-theme]');
    if (!b) return;
    if (b.dataset.ewV) v = b.dataset.ewV; else theme = b.dataset.ewTheme;
    render();
  });
  render();
})();
</script>

<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>works Live-Tracking Entwurf</title>
<style>
@font-face { font-family: "Geist"; src: url("../../../plugins/works/skills/works/scripts/board/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }

/* Farben und Maße 1:1 aus dem works-Board */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --raised: #f8fafc; --sunken: #e9edf2;
  --line: #dce1e8; --line-strong: #c5cdd8; --text: #18202c; --text-2: #3f4a5c; --muted: #647085;
  --accent: #5550d9; --accent-soft: #e9e8fc; --on-accent: #ffffff;
  --danger: #d93a40; --ok: #1f9d6c; --warn: #c9860b;
  --p1: #e5484d; --p2: #ea7a2e; --p3: #3d7fe8; --p4: #8a95a8;
  --s-backlog: #8a95a8; --s-geplant: #3d7fe8; --s-in-arbeit: #e0a21c;
  --s-review: #9667e6; --s-erledigt: #22a874; --s-verworfen: #6a7689;
  --shadow-card: 0 1px 0 rgba(24, 32, 44, .04), 0 1px 3px rgba(24, 32, 44, .06);
  --shadow-pop: 0 18px 48px rgba(20, 26, 36, .18);
  --r-card: 10px; --r-ctrl: 8px;
  --font: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
}
:root[data-theme="dark"] { color-scheme: dark; }
:root[data-theme="light"] { color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141a24; --surface: #1c2330; --raised: #222b3a; --sunken: #10151e;
    --line: #2b3546; --line-strong: #3a475c; --text: #e6eaf2; --text-2: #c0c8d6; --muted: #8d98ab;
    --accent: #7f7bf6; --accent-soft: #2a2b4d; --on-accent: #10131c;
    --danger: #f0676c; --ok: #3dbe8b; --warn: #f2b33d;
    --p1: #f0676c; --p2: #f39a58; --p3: #6ea2f7; --p4: #8d98ab;
    --s-backlog: #8d98ab; --s-geplant: #6ea2f7; --s-in-arbeit: #f2b33d;
    --s-review: #b08af2; --s-erledigt: #3dbe8b; --s-verworfen: #6a7689;
    --shadow-card: 0 1px 0 rgba(0, 0, 0, .25); --shadow-pop: 0 18px 48px rgba(0, 0, 0, .5);
  }
}
:root[data-theme="dark"] {
  --bg: #141a24; --surface: #1c2330; --raised: #222b3a; --sunken: #10151e;
  --line: #2b3546; --line-strong: #3a475c; --text: #e6eaf2; --text-2: #c0c8d6; --muted: #8d98ab;
  --accent: #7f7bf6; --accent-soft: #2a2b4d; --on-accent: #10131c;
  --danger: #f0676c; --ok: #3dbe8b; --warn: #f2b33d;
  --p1: #f0676c; --p2: #f39a58; --p3: #6ea2f7; --p4: #8d98ab;
  --s-backlog: #8d98ab; --s-geplant: #6ea2f7; --s-in-arbeit: #f2b33d;
  --s-review: #b08af2; --s-erledigt: #3dbe8b; --s-verworfen: #6a7689;
  --shadow-card: 0 1px 0 rgba(0, 0, 0, .25); --shadow-pop: 0 18px 48px rgba(0, 0, 0, .5);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--muted); }
.spacer { flex: 1; }
kbd { font-family: inherit; font-size: 12px; background: var(--sunken); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--muted); }
h1, h2, h3 { margin: 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: var(--r-ctrl); border: 1px solid var(--line); background: var(--surface); font-weight: 500; white-space: nowrap; transition: background-color .15s, border-color .15s; }
.btn:hover { border-color: var(--line-strong); background: var(--raised); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--text)); }
.btn.primary kbd { background: transparent; color: inherit; border-color: color-mix(in srgb, var(--on-accent) 40%, transparent); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--sunken); color: var(--text); }
.btn.small { height: 28px; padding: 0 10px; font-size: 13px; }
.btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.count { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--on-accent); font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 10px; background: var(--sunken); color: var(--text-2); font-size: 11px; white-space: nowrap; }
.tag.agent { background: var(--accent-soft); color: var(--text); }

/* ---------- Entwurfsrahmen (gehört nicht zum Design) ---------- */
.frame { padding: 10px 24px 12px; background: repeating-linear-gradient(-45deg, color-mix(in srgb, var(--accent) 7%, var(--surface)) 0 12px, color-mix(in srgb, var(--accent) 11%, var(--surface)) 12px 24px); border-bottom: 1px dashed var(--accent); display: grid; gap: 8px; }
.frame-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.frame-label { font-size: 12px; font-weight: 600; color: var(--accent); letter-spacing: .02em; }
.frame-tabs { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); padding: 2px; gap: 2px; }
.frame-tabs button { border: 0; background: none; height: 32px; padding: 0 12px; border-radius: 7px; font-weight: 500; font-size: 13px; color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; }
.frame-tabs button:hover { background: var(--raised); color: var(--text); }
.frame-tabs button[aria-selected="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.frame-tabs .rec { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 8px; background: color-mix(in srgb, var(--ok) 20%, transparent); color: var(--text); }
.frame-tabs button[aria-selected="true"] .rec { background: color-mix(in srgb, var(--on-accent) 25%, transparent); color: inherit; }
.frame-ctrl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.frame-clock { font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.frame-note { margin: 0; font-size: 13px; color: var(--text-2); max-width: 120ch; }
.frame-note b { color: var(--text); }

/* ---------- Kopfzeile wie im Board ---------- */
.top { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 24px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.top h1 { font-size: 16px; font-weight: 650; letter-spacing: -.01em; white-space: nowrap; }
.top h1 .dim { color: var(--muted); font-weight: 500; }
.livecon { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.livecon::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
.busy { display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 11px; border-radius: 13px; border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--line)); background: color-mix(in srgb, var(--warn) 10%, var(--surface)); font-size: 12px; white-space: nowrap; }
.views { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-ctrl); overflow: hidden; background: var(--surface); flex: none; max-width: 100%; }
.views button { height: 32px; padding: 0 12px; border: 0; background: transparent; color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; }
.views button + button { border-left: 1px solid var(--line); }
.views button:hover { background: var(--raised); color: var(--text); }
.views button[aria-pressed="true"] { background: var(--accent-soft); color: var(--text); font-weight: 600; }
.actions { display: flex; gap: 6px; align-items: center; margin-left: auto; }

/* ---------- Gemeinsame Bausteine ---------- */
.pdot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--s-in-arbeit); animation: wpulse 1.4s ease-in-out infinite; display: inline-block; }
@keyframes wpulse { 50% { opacity: .35; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes flash { from { background-color: color-mix(in srgb, var(--fc, var(--ok)) 26%, transparent); } }
@keyframes rise { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
@keyframes tin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Statussymbol: Farbe plus Form, nie Farbe allein */
.si { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; background: var(--sunken); color: var(--muted); }
.si svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.si.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.si.fail { background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); }
.si.warn { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); }
.si.run { background: none; border: 2px solid var(--accent); border-right-color: transparent; animation: spin .8s linear infinite; }
.si.cur { background: color-mix(in srgb, var(--s-in-arbeit) 22%, transparent); color: var(--s-in-arbeit); }
.si.cur svg { animation: wpulse 1.4s ease-in-out infinite; }
.si.wait { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.si.manual { background: var(--accent-soft); color: var(--accent); }
.si.review { background: color-mix(in srgb, var(--s-review) 20%, transparent); color: var(--s-review); }
.si.next { background: color-mix(in srgb, var(--s-geplant) 16%, transparent); color: var(--s-geplant); }

.bar { display: block; height: 6px; border-radius: 3px; background: var(--sunken); overflow: hidden; }
.bar > i { display: block; height: 100%; width: var(--w, 0%); background: var(--c, var(--s-in-arbeit)); border-radius: 3px; transition: width .6s cubic-bezier(.2, .7, .2, 1); }
.segbar { display: flex; gap: 3px; }
.segbar i { flex: 1; height: 8px; border-radius: 2px; background: var(--sunken); transition: background-color .4s; }
.segbar i.done { background: var(--ok); }
.segbar i.cur { background: var(--s-in-arbeit); }
.segbar i.review { background: var(--s-review); }
.segbar i.check { background: var(--accent); }

.panel-s { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.sec-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; min-width: 0; }
.sec-head h2, .sec-head h3 { font-size: 13px; font-weight: 600; white-space: nowrap; }
.meta { font-size: 12px; color: var(--muted); }
.seg-btns { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; margin-left: auto; }
.seg-btns button { border: 0; background: none; height: 24px; padding: 0 8px; font-size: 12px; color: var(--text-2); }
.seg-btns button + button { border-left: 1px solid var(--line); }
.seg-btns button[aria-pressed="true"] { background: var(--accent-soft); color: var(--text); font-weight: 600; }

/* Phasen einer Aufgabe */
.phases { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.phases li { position: relative; display: grid; gap: 1px; padding-top: 11px; min-width: 0; }
.phases li::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; border-radius: 2px; background: var(--sunken); }
.phases li.done::before { background: var(--ok); }
.phases li.cur::before { background: linear-gradient(90deg, var(--phc) var(--p), color-mix(in srgb, var(--phc) 22%, var(--sunken)) var(--p)); }
.ph-name { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.phases li.done .ph-name, .phases li.cur .ph-name { color: var(--text); }
.ph-sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.phases li.cur .ph-sub { color: var(--text-2); }
.phases.big li::before { height: 6px; border-radius: 3px; }
.phases.big li { padding-top: 14px; }
.phases.big .ph-name { font-size: 14px; }
.phases.big .ph-sub { font-size: 13px; }

/* Umsetzungsplan */
.steps { list-style: none; margin: 0; padding: 0; display: grid; }
.steps li { position: relative; display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 7px 8px; margin: 0 -8px; border-radius: 8px; }
.steps li:not(:last-child)::after { content: ""; position: absolute; left: 17.5px; top: 29px; bottom: -5px; width: 1px; background: var(--line); }
.steps li.done:not(:last-child)::after { background: color-mix(in srgb, var(--ok) 55%, var(--line)); }
.steps li.cur { background: color-mix(in srgb, var(--s-in-arbeit) 9%, transparent); }
.steps li.cur.fresh { animation: rise .4s ease-out; }
.s-t { font-size: 13.5px; line-height: 20px; overflow-wrap: anywhere; }
.steps li.done .s-t { color: var(--text-2); }
.steps li.cur .s-t { font-weight: 600; }
.steps li.todo .s-t { color: var(--muted); }
.s-time { font-size: 12px; line-height: 20px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.crit { margin: 10px 0 0; font-size: 13px; color: var(--text-2); display: flex; align-items: center; gap: 8px; }

/* Prüfungen, angelehnt an den Abschluss-Dialog des Boards */
.checks { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.ck + .ck { border-top: 1px solid var(--line); }
.ck { padding: 8px 12px; display: grid; gap: 6px; }
.ck.warn { background: color-mix(in srgb, var(--warn) 7%, transparent); }
.ck.fail { background: color-mix(in srgb, var(--danger) 7%, transparent); }
.ck.run { background: color-mix(in srgb, var(--accent) 6%, transparent); }
.ck.flash { animation: flash 1.4s ease-out; }
.ck.flash.run { --fc: var(--accent); }
.ck-row { display: flex; align-items: center; gap: 10px; font-size: 13px; min-width: 0; }
.ck-name { font-weight: 600; white-space: nowrap; }
.ck-cmd { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.ck-st { flex: none; font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ck-out { margin: 0 0 0 30px; padding: 6px 8px; border-radius: 6px; background: var(--sunken); font: 12px/1.5 var(--mono); white-space: pre-wrap; color: var(--text-2); overflow-wrap: anywhere; }
.ck-note { margin: 0 0 0 30px; font-size: 13px; display: grid; gap: 8px; color: var(--text-2); }
.ck-note p { margin: 0; }
.row-btns { display: flex; flex-wrap: wrap; gap: 6px; }
.ck-group { display: grid; gap: 8px; }
.ck-group + .ck-group { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.ckg-head { display: flex; align-items: center; gap: 8px; font-size: 13px; min-width: 0; }
.ckg-head b { white-space: nowrap; }
.ckg-head .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); }
.ckg-note { margin: 0; font-size: 12.5px; color: var(--muted); }
details.ck-group > summary { list-style: none; cursor: pointer; border-radius: 8px; padding: 2px 0; }
details.ck-group > summary::-webkit-details-marker { display: none; }
details.ck-group > summary .chev { margin-left: auto; transition: transform .2s; color: var(--muted); }
details.ck-group[open] > summary .chev { transform: rotate(180deg); }
.chev { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; flex: none; }

/* Verlauf */
.feed { list-style: none; margin: 0; padding: 0; display: grid; }
.feed li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 6px 0; font-size: 13px; border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent); min-width: 0; }
.feed.with-id li { grid-template-columns: auto auto minmax(0, 1fr); }
.feed li:last-child { border-bottom: 0; }
.feed li.new { animation: rise .35s ease-out; }
.f-time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.f-id { font-size: 11px; font-weight: 600; color: var(--text-2); background: var(--sunken); border-radius: 5px; padding: 0 5px; white-space: nowrap; }
.f-what { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: baseline; gap: 6px; }
.f-what .mono { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; }
.f-verb { flex: none; }
.fi { flex: none; align-self: center; width: 14px; height: 14px; display: inline-grid; place-items: center; border-radius: 50%; }
.fi svg { width: 10px; height: 10px; stroke: currentColor; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.fi.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.fi.err { background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); }
.fi.chk { background: var(--accent-soft); color: var(--accent); }
.fi.rev { background: color-mix(in srgb, var(--s-review) 20%, transparent); color: var(--s-review); }
.f-err { flex: none; font-size: 11px; font-weight: 600; color: var(--danger); }
.feed li.k-step .f-verb, .feed li.k-phase .f-verb { font-weight: 600; }

/* Gerade jetzt */
.now { border-radius: 10px; padding: 12px 14px; background: color-mix(in srgb, var(--s-in-arbeit) 8%, var(--raised)); border: 1px solid color-mix(in srgb, var(--s-in-arbeit) 30%, var(--line)); display: grid; gap: 3px; min-width: 0; }
.now.done { background: color-mix(in srgb, var(--s-review) 8%, var(--raised)); border-color: color-mix(in srgb, var(--s-review) 30%, var(--line)); grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 4px 12px; }
.now.fin { background: color-mix(in srgb, var(--ok) 8%, var(--raised)); border-color: color-mix(in srgb, var(--ok) 30%, var(--line)); grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 4px 12px; }
.n-label { font-size: 12px; color: var(--text-2); display: flex; align-items: center; gap: 7px; }
.n-what { font-size: 15px; font-weight: 600; display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.n-what .mono { font-size: 13.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.n-meta { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.instr { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.instr input { flex: 1 1 260px; min-width: 0; height: 34px; padding: 0 10px; border-radius: var(--r-ctrl); border: 1px solid var(--line); background: var(--surface); }
.instr input::placeholder { color: var(--muted); }
.instr .meta { flex-basis: 100%; }

.toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 60; width: min(380px, calc(100vw - 32px)); }
body[data-view="B"] .toasts { bottom: 96px; }
.toast { --cc: var(--accent); display: grid; gap: 2px; padding: 10px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--cc); box-shadow: var(--shadow-pop); font-size: 13px; animation: tin .22s ease-out; }
.toast.ok { --cc: var(--ok); } .toast.rev { --cc: var(--s-review); }
.toast .what { font-weight: 600; } .toast .why { color: var(--muted); font-size: 12px; }
.toast.out { opacity: 0; transform: translateY(6px); transition: opacity .25s, transform .25s; }

/* ---------- Variante A: eigene Live-Ansicht ---------- */
.lv { padding: 16px 24px 48px; display: grid; gap: 16px; }
.lv-sum { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.tile h3 { font-size: 12px; font-weight: 500; color: var(--muted); display: flex; align-items: center; gap: 7px; }
.tile .big { font-size: 20px; font-weight: 650; letter-spacing: -.01em; line-height: 1.2; font-variant-numeric: tabular-nums; }

  function push(e) { e.id = ++M.seq; e.at = now(); M.feed.unshift(e); M.feed = M.feed.slice(0, 40); }

  // ---------- Abgeleitete Werte ----------
  function stepInfo(t) { const s = t.steps || []; const cur = s.findIndex((x) => !x.done); return { done: s.filter((x) => x.done).length, total: s.length, cur, curT: cur >= 0 ? s[cur].t : '' }; }
  function chkInfo(t) {
    const c = t.checks || [];

  function statusOf(t) {
    const s = stepInfo(t), c = chkInfo(t);
    switch (t.phase) {
      case 'erledigt': return { ic: 'ok', text: 'Erledigt um ' + hm(t.doneAt), w: 100, c: 'var(--s-erledigt)' };
      case 'review': return { ic: c.warn ? 'warn' : 'review', text: 'Wartet auf deine Abnahme' + (c.warn ? ', ' + c.warn + ' Fund' : ''), w: 100, c: 'var(--s-review)' };

      if (p === 'start') sub = t.startedAt ? hm(t.startedAt) : 'noch nicht';
      if (p === 'umsetzung') sub = s.total ? s.done + ' von ' + s.total + ' Schritten' : '';
      if (p === 'pruefung') sub = !c.total ? 'keine eingerichtet' : idx < 2 ? c.total + ' eingerichtet' : c.finished + ' von ' + c.total;
      if (p === 'review') sub = t.phase === 'review' ? 'wartet auf dich' : '';
      if (p === 'erledigt') sub = t.doneAt ? hm(t.doneAt) : '';
      const pct = p === 'umsetzung' ? s.done / Math.max(1, s.total) * 100 : p === 'pruefung' ? c.finished / Math.max(1, c.total) * 100 : 100;

    const s = stepInfo(t), c = chkInfo(t);
    if (t.phase === 'umsetzung') return '<div class="strip"><div class="strip-row"><i class="pdot" aria-hidden="true"></i><b>Schritt ' + (s.cur + 1) + ' von ' + s.total + '</b><span class="spacer"></span><span class="muted num">seit ' + live(t.stepSince, 'min') + '</span></div><span class="bar" style="--w:' + (s.done / s.total * 100) + '%"><i></i></span><div class="strip-row"><span>' + esc(t.now.verb) + '</span><span class="mono">' + esc(t.now.what) + '</span></div></div>';
    if (t.phase === 'pruefung') return '<div class="strip"><div class="strip-row"><b>Prüfungen ' + c.finished + ' von ' + c.total + '</b><span class="spacer"></span><span class="mini-checks" aria-hidden="true">' + t.checks.map((x) => si(x.st)).join('') + '</span></div><div class="strip-row muted">Agent im eigenen Worktree' + (c.run ? ', ' + esc(c.run.n) + ' läuft' : '') + '</div></div>';
    if (t.phase === 'review' && c.warn) return '<div class="strip"><div class="strip-row">' + si('warn') + '<span>' + c.warn + ' Fund in ' + t.checks.filter((x) => x.st === 'warn').map((x) => x.n).join(', ') + '</span></div></div>';
    if (t.phase === 'review') return '<div class="strip"><div class="strip-row">' + si('ok') + '<span>Alle ' + c.total + ' Prüfungen bestanden</span></div></div>';
    return '';
  }
  function cardB(t) {
    return '<article class="card" data-prio="' + t.prio + '"><div class="card-top"><span class="id">' + t.id + '</span><span>' + (t.type || 'Feature') + '</span>' + (t.lane ? '<span class="tag agent">Agent</span>' : '') + '<span class="prio">' + t.prio + '</span></div><div class="title">' + esc(t.title) + '</div>' + liveStrip(t) + '</article>';
  }
  function renderB() {
    const extra = { backlog: [{ id: 'W-0021', title: 'Backups verschlüsseln', prio: 'P3', type: 'Feature' }, { id: 'W-0022', title: 'Webhook bei fehlgeschlagenem Backup', prio: 'P4', type: 'Feature' }], erledigt: [{ id: 'W-0011', title: 'Logs nach 30 Tagen löschen', prio: 'P4', type: 'Chore' }] };
    const cols = [
      ['backlog', 'Backlog', 'var(--s-backlog)', extra.backlog],
      ['geplant', 'Geplant', 'var(--s-geplant)', M.tasks.filter((t) => t.phase === 'queue')],
      ['in-arbeit', 'In Arbeit', 'var(--s-in-arbeit)', M.tasks.filter((t) => t.phase === 'umsetzung' || t.phase === 'pruefung')],
      ['review', 'Review', 'var(--s-review)', M.tasks.filter((t) => t.phase === 'review')],
      ['erledigt', 'Erledigt', 'var(--s-erledigt)', M.tasks.filter((t) => t.phase === 'erledigt').concat(extra.erledigt)],
    ];
    return header('board') + '<main class="bv-board" aria-label="Board">' + cols.map(([k, l, c, list]) => '<section class="col" style="--c:' + c + '" aria-label="' + l + '"><div class="col-head"><span class="dot"></span><h2>' + l + '</h2><span class="n">' + list.length + '</span></div><div class="cards">' + list.map(cardB).join('') + '</div></section>').join('') + '</main>' + dock();
  }
  function dock() {
    const t = mainTask(), s = stepInfo(t), lane = laneTask(), att = attention();
    const laneActive = lane && lane.phase === 'pruefung';
    const chips = lane.checks.map((c) => '<span class="chip ' + c.st + '" title="' + esc(c.n + ': ' + CK_LABEL[c.st]) + '">' + si(c.st) + (c.st === 'run' || c.st === 'warn' ? '<span>' + esc(c.n) + (c.st === 'run' ? ' ' + live(c.at, 'sec') : '') + '</span>' : '') + '<span class="sr">' + esc(c.n + ' ' + CK_LABEL[c.st]) + '</span></span>').join('');
    let h = '<section class="dock" aria-label="Live-Leiste"><div class="dock-bar"><i class="pdot" aria-hidden="true"></i>' +
      '<div class="d-cell d-task"><span class="t1">Claude arbeitet an ' + t.id + ', seit ' + live(M.sessionSince, 'min') + '</span><span class="t2">' + esc(t.title) + '</span></div>' +
      '<div class="d-cell d-step"><span class="t1">Schritt ' + (s.cur + 1) + ' von ' + s.total + '</span><span class="bar" style="--w:' + (s.done / s.total * 100) + '%"><i></i></span></div>' +
      '<div class="d-cell d-now"><span class="t1">Gerade jetzt, seit ' + live(t.now.at) + '</span><span class="t2"><span>' + esc(t.now.verb) + '</span><span class="mono">' + esc(t.now.what) + '</span></span></div>' +
      '<span class="d-sep" aria-hidden="true"></span>' +
      '<div class="d-cell d-checks"><span class="t1">' + lane.id + (laneActive ? ' · Agent prüft' : ' · Agent fertig, Review') + '</span><span class="chips">' + chips + '</span></div>' +
      '<button type="button" class="btn small d-attn' + (att.length ? ' hot' : '') + '" data-drawer data-k="attn"><span class="lbl">Wartet auf dich</span> <span class="count">' + att.length + '</span></button>' +
      '<button type="button" class="btn small" data-drawer data-k="drawer" aria-expanded="' + M.drawer + '">' + (M.drawer ? 'Einklappen ' + chev : 'Details ' + chevUp) + '</button></div>';
    if (M.drawer) {
      const groups = M.tasks.filter((x) => x.phase === 'pruefung' || (x.phase === 'review' && chkInfo(x).warn) || x.lane).sort((a, b) => (b.phase === 'pruefung') - (a.phase === 'pruefung'));
      h += '<div class="dock-drawer"><section><div class="sec-head"><h2>Umsetzungsplan ' + t.id + '</h2><span class="meta">' + s.done + ' von ' + s.total + ' erledigt</span></div>' + stepsList(t) + '</section>' +
        '<section><div class="sec-head"><h2>Verlauf</h2><span class="meta">alle Aufgaben</span></div>' + feedList(M.feed.slice(0, 8), true) + '</section>' +
        '<section><div class="sec-head"><h2>Prüfungen</h2></div>' + groups.map((x) => '<div class="ck-group"><div class="ckg-head">' + si(chkInfo(x).run ? 'run' : chkInfo(x).warn ? 'warn' : 'ok') + '<b>' + x.id + '</b><span class="t">' + esc(x.title) + '</span></div>' + checksList(x, { compact: true }) + '</div>').join('') + '</section></div>';
    }
    return h + '</section>';
  }

  // ---------- Variante C ----------
  function renderC() {
    const t = mainTask(), s = stepInfo(t), lane = laneTask();
    const ck = M.tasks.find((x) => x.phase === 'pruefung') || lane;
    const ci = chkInfo(ck);
    const warnTask = M.tasks.find((x) => x.phase === 'review' && chkInfo(x).warn);
    const tile = (c) => '<div class="mc ' + c.st + (c.flash ? ' flash' : '') + '">' + si(c.st) + '<span class="mc-name">' + esc(c.n) + '</span><span class="mc-st">' + (c.st === 'run' ? 'läuft ' + live(c.at, 'sec') : c.ms && c.st === 'ok' ? 'bestanden, ' + secs(c.ms) : CK_LABEL[c.st]) + '</span></div>';
    const laneTile = (x) => {
      const st = statusOf(x), c = chkInfo(x);
      const cls = x.phase === 'umsetzung' || x.phase === 'pruefung' ? 'active' : x.phase === 'review' ? 'attn' : x.phase === 'erledigt' ? 'fin' : '';
      return '<article class="ml ' + cls + '">' + si(st.ic) + '<span class="ml-id">' + x.id + (x.lane ? ' · Agent' : '') + '</span><span class="ml-title">' + esc(x.title) + '</span><span class="ml-sub">' + esc(st.text) + '</span>' + (st.w != null && x.phase !== 'erledigt' ? '<span class="bar" style="--w:' + st.w + '%;--c:' + st.c + '"><i></i></span>' : '') + '</article>';
    };
    return '<main class="mon" aria-label="Monitor"><div class="mon-top"><h1>discord-backup-bot</h1><span class="livecon">Live</span><span class="meta">Claude arbeitet seit ' + live(M.sessionSince, 'min') + '</span><span class="mon-clock" data-clock>' + hms(now()) + '</span></div>' +
      '<div class="mon-hero"><section class="mon-panel" aria-label="Aktuelle Aufgabe"><div class="mon-kicker"><i class="pdot" aria-hidden="true"></i>Claude arbeitet an <b>' + t.id + '</b></div><h2 class="mon-title">' + esc(t.title) + '</h2>' + phases(t, true) +
      '<div class="mon-step"><span class="n">' + (s.cur + 1) + '<small> von ' + s.total + '</small></span><span class="t">' + esc(s.curT) + '</span></div>' +
      '<div class="segbar big" aria-hidden="true">' + t.steps.map((x, i) => '<i class="' + (x.done ? 'done' : i === s.cur ? 'cur' : '') + '"></i>').join('') + '</div>' +
      '<div class="mon-now"><span class="muted">Gerade jetzt</span><b>' + esc(t.now.verb) + '</b><span class="mono">' + esc(t.now.what) + '</span><span class="muted">seit ' + live(t.now.at) + '</span></div></section>' +
      '<section class="mon-panel" aria-label="Prüfungen"><div class="mon-kicker">Prüfungen <b>' + ck.id + '</b> ' + esc(ck.title) + (ck.lane ? ' (Agent)' : '') + '<span class="spacer"></span><span class="num">' + ci.finished + ' von ' + ci.total + '</span></div><div class="mon-checks">' + ck.checks.map(tile).join('') + '</div>' +
      (warnTask ? '<p class="mon-attn">' + si('warn') + '<span><b>' + warnTask.id + '</b> wartet auf dich: Fund in ' + warnTask.checks.filter((x) => x.st === 'warn').map((x) => x.n).join(', ') + '</span></p>' : '') + '</section></div>' +
      '<section aria-label="Aufgaben dieser Sitzung"><h2 class="mon-h">Diese Sitzung</h2><div class="mon-lanes">' + M.tasks.map(laneTile).join('') + '</div></section>' +
      '<section class="mon-panel" aria-label="Verlauf"><h2 class="mon-h" style="margin:0">Verlauf</h2>' + feedList(M.feed.slice(0, 6), true) + '</section></main>';
  }

  // ---------- Rahmen, Rendern, Ereignisse ----------
  const NOTES = {
    A: '<b>Live-Ansicht:</b> ein siebter Reiter im Board (Taste 7). Links die Aufgaben dieser Sitzung, in der Mitte die gewählte Aufgabe mit Phase, Umsetzungsplan und dem, was Claude gerade tut, rechts alle Prüfungen. Zeigt am meisten auf einmal und eignet sich auch für einen zweiten Bildschirm. Dafür musst du in die Ansicht wechseln, die Pille oben führt direkt hin. Klick links auf eine Aufgabe, um sie in der Mitte zu sehen.',
    B: '<b>Live-Leiste:</b> eine Leiste unten im Board, in jeder Ansicht sichtbar. Sie zeigt Aufgabe, Schritt, aktuelle Aktion und die Prüfungen des Agenten, die Karten in Arbeit bekommen einen Fortschrittsstreifen. „Details“ klappt Plan, Verlauf und Prüfungen auf. Du siehst den Stand, ohne die Ansicht zu wechseln, eingeklappt passt aber nur das Nötigste hinein und bei mehreren Agenten wird es eng.',
    C: '<b>Monitor:</b> eine eigene Seite (etwa /live), gedacht für einen zweiten Bildschirm oder den geteilten Link. Große Schrift, aus der Entfernung lesbar, nur Ansehen. Gut zum Mitlaufen nebenher. Zum Eingreifen (Anweisung schicken, Fund markieren, abnehmen) musst du ins Board wechseln.',
  };
  let V = /^#[ABC]$/.test(location.hash) ? location.hash.slice(1) : 'A';

  function render() {
    const keep = {};
    $$('#stage input[id]').forEach((i) => { keep[i.id] = { v: i.value, f: document.activeElement === i, s: i.selectionStart }; });
    const ae = document.activeElement;
    const key = ae && ae.closest && ae.closest('#stage') ? (ae.dataset.k ? '[data-k="' + ae.dataset.k + '"]' : ae.dataset.focus ? '.run [data-focus="' + ae.dataset.focus + '"]' : null) : null;
    const openDetails = $$('#stage details[open] summary b').map((b) => b.textContent);
    $('#stage').innerHTML = V === 'A' ? renderA() : V === 'B' ? renderB() : renderC();
    for (const [id, k] of Object.entries(keep)) { const i = document.getElementById(id); if (i) { i.value = k.v; if (k.f) { i.focus(); try { i.setSelectionRange(k.s, k.s); } catch (e) { /* egal */ } } } }
    if (key) { const el = $(key); if (el) el.focus({ preventScroll: true }); }
    $$('#stage details').forEach((d) => { const b = $('summary b', d); if (b && openDetails.includes(b.textContent)) d.open = true; });
    M.tasks.forEach((t) => (t.checks || []).forEach((c) => { c.flash = false; }));
    animatedUpTo = M.seq;
    document.body.dataset.view = V;
    $$('[data-variant]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.variant === V)));
    $('#note').innerHTML = NOTES[V];
  }

  function toast(kind, what, why) {
    const box = $('#toasts');
    const el = document.createElement('div');
    el.className = 'toast ' + kind;
    el.innerHTML = '<div class="what">' + esc(what) + '</div><div class="why">' + esc(why) + '</div>';
    box.prepend(el);
    while (box.children.length > 3) box.lastChild.remove();
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, 6000);
  }
  function say(text) { const a = $('#announce'); a.textContent = ''; setTimeout(() => { a.textContent = text; }, 50); }

  document.addEventListener('click', (e) => {
    const v = e.target.closest('[data-variant]');
    if (v) { V = v.dataset.variant; history.replaceState(null, '', '#' + V); window.scrollTo(0, 0); render(); return; }
    const f = e.target.closest('[data-focus]');
    if (f && V === 'A') { M.focus = f.dataset.focus; render(); return; }
    const d = e.target.closest('[data-drawer]');
    if (d && V === 'B') { M.drawer = !M.drawer; render(); return; }
    const fa = e.target.closest('[data-feedall]');
    if (fa) { M.feedAll = fa.dataset.feedall === '1'; render(); }
  });

  $('#pause').onclick = () => {
    if (pausedAt == null) { pausedAt = Date.now(); $('#pause').textContent = 'Weiter'; }
    else { pausedTotal += Date.now() - pausedAt; pausedAt = null; $('#pause').textContent = 'Live anhalten'; }
  };
  $('#restart').onclick = () => { const keepFocus = M.focus, keepDrawer = M.drawer; M = initial(); M.focus = keepFocus; M.drawer = keepDrawer; animatedUpTo = M.seq; simT = 0; render(); };

  let theme = null;
  try { theme = localStorage.getItem('works-live-theme'); } catch (e) { theme = null; }
  if (!theme) theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  function applyTheme() {
    document.documentElement.dataset.theme = theme;
    $('#theme').textContent = theme === 'dark' ? 'Hell' : 'Dunkel';
    $('#theme').setAttribute('aria-label', theme === 'dark' ? 'Helles Farbschema' : 'Dunkles Farbschema');
  }
  $('#theme').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('works-live-theme', theme); } catch (e) { /* egal */ } applyTheme(); };
  applyTheme();

  setInterval(() => {
    if (pausedAt == null) {
      simT++;
      if (simT >= LOOP) { const keepFocus = M.focus, keepDrawer = M.drawer; M = initial(); M.focus = keepFocus; M.drawer = keepDrawer; animatedUpTo = M.seq; simT = 0; render(); }
      else if (SCRIPT[simT]) { SCRIPT[simT](); render(); }
    }
    $$('[data-since]').forEach((el) => { el.textContent = since(+el.dataset.since, el.dataset.fmt); });
    $$('[data-clock]').forEach((el) => { el.textContent = hms(now()); });
    $('#simclock').textContent = 'Ablauf ' + Math.floor(simT / 60) + ':' + pad(simT % 60) + ' von 0:' + LOOP;
  }, 1000);

  render();
})();
</script>
</body>
</html>

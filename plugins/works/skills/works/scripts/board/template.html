<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>__TITLE__</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='14' height='14' rx='4' fill='%235550d9'/%3E%3Cpath d='M4.5 6h7M4.5 8.5h7M4.5 11h4' stroke='%23fff' stroke-width='1.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>/*__CSS__*/</style>
</head>
<body>
<div class="orphan-bar" id="orphanBar" role="alert" hidden></div>
<a class="skip" href="#board">{{t:Skip to the board}}</a>

<header class="top">
  <div class="brand">
    <a class="hub-link" id="hubLink" href="/hub" hidden></a>
    <h1 id="project"></h1>
    <span class="live" id="live" hidden></span>
    <span class="busy-wrap" id="busyWrap" hidden>
      <button class="busy" id="busy" type="button" aria-expanded="false" aria-controls="busyPop" hidden></button>
      <div class="busy-pop" id="busyPop" role="group" aria-label="{{t:What Claude is doing right now}}">
        <div class="bp-body" id="busyPopBody"></div>
        <div class="bp-foot"><span id="busyLast"></span><button class="btn" type="button" id="busyGo"></button></div>
      </div>
    </span>
  </div>
  <nav class="views" id="views" aria-label="{{t:View}}">
    <button data-view="board" aria-pressed="true">{{t:Board}}</button>
    <button data-view="sprint" aria-pressed="false">{{t:Sprint}}</button>
    <button data-view="queue" aria-pressed="false">{{t:Queue}} <span class="count" id="queueCount" hidden></span></button>
    <button data-view="timeline" aria-pressed="false">{{t:Timeline}}</button>
    <button data-view="graph" aria-pressed="false">{{t:Dependencies}}</button>
    <button data-view="table" aria-pressed="false">{{t:Table}}</button>
    <button data-view="live" aria-pressed="false" data-live><i class="lv-dot" id="livePulse" hidden aria-hidden="true"></i>{{t:Live}}</button>
  </nav>
  <label class="search">
    <span class="sr">{{t:Search tasks}}</span>
    <input id="q" type="search" placeholder="{{t:Search by title, ID or tag}}" autocomplete="off">
    <kbd>/</kbd>
  </label>
  <nav class="actions" aria-label="{{t:Actions}}">
    <button class="btn ghost" id="btnNext" data-live>{{t:Next task}}</button>
    <button class="btn ghost" id="btnIdeas" data-live>{{t:Ideas}} <span class="count" id="ideaCount" hidden></span></button>
    <button class="btn ghost" id="btnActivity" data-live>{{t:Activity}} <span class="count" id="actCount" hidden></span></button>
    <button class="btn ghost" id="btnShare" data-edit>{{t:Share}}</button>
    <button class="btn ghost icon" id="btnTools" data-live title="{{t:Reports, templates, checks and notifications}}" aria-label="{{t:Tools and settings}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span class="count" id="toolsCount" hidden></span></button>
    <button class="btn ghost icon" id="btnTheme" title="{{t:Switch color scheme}}" aria-label="{{t:Switch color scheme}}"></button>
    <button class="btn primary" id="btnNew" data-edit>{{t:New task}} <kbd>N</kbd></button>
  </nav>
</header>

<div class="readonly" id="readonly" hidden>
  {{t:View only. To edit, open the board with}} <code>works board --serve</code> {{t:or ask Claude to start the board.}}
</div>

<section class="overview" aria-label="{{t:At a glance}}" data-only="board">
  <div class="flow" id="flow" role="list"></div>
  <div class="signals" id="signals"></div>
</section>

<section class="filters" aria-label="{{t:Filters}}" data-only="board timeline graph table">
  <div class="prio-filter" id="prioFilter" role="group" aria-label="{{t:Priority}}"></div>
  <select id="typeFilter" aria-label="{{t:Type}}"><option value="">{{t:All types}}</option></select>
  <select id="tagFilter" aria-label="{{t:Tag}}"><option value="">{{t:All tags}}</option></select>
  <select id="msFilter" aria-label="{{t:Milestone}}"><option value="">{{t:All milestones}}</option></select>
  <button class="btn small ghost" id="msEdit" hidden data-edit>{{t:Edit milestone}}</button>
  <label class="toggle"><input type="checkbox" id="showClosed"> {{t:Archive and dropped}}</label>
  <button class="btn link" id="resetFilters" hidden>{{t:Reset filters}}</button>
</section>

<section class="saved-views" id="savedViews" aria-label="{{t:Saved views}}" data-only="board timeline graph table"></section>

<section class="progress" id="progress" aria-label="{{t:Progress}}" data-only="board"></section>

<main class="board" id="board" tabindex="-1" data-only="board"></main>
<main class="view sprint-view" id="viewSprint" tabindex="-1" data-only="sprint" hidden></main>
<main class="view graph-view" id="viewGraph" tabindex="-1" data-only="graph" hidden></main>
<main class="view queue-view" id="viewQueue" tabindex="-1" data-only="queue" hidden></main>
<main class="view tl-view" id="viewTimeline" tabindex="-1" data-only="timeline" hidden></main>
<main class="view table-view" id="viewTable" tabindex="-1" data-only="table" hidden></main>
<main class="view live-view" id="viewLive" tabindex="-1" data-only="live" hidden></main>
<div class="bulk" id="bulk" hidden role="toolbar" aria-label="{{t:Edit several tasks}}"></div>

<aside class="panel" id="panel" aria-label="{{t:Task details}}" hidden>
  <div class="panel-inner" id="panelBody"></div>
</aside>
<div class="scrim" id="scrim" hidden></div>

<aside class="panel narrow" id="sidePanel" aria-label="{{t:Sidebar}}" hidden>
  <div class="panel-inner" id="sideBody"></div>
</aside>

<dialog id="dialog"><form method="dialog" id="dialogForm"></form></dialog>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="sr" aria-live="polite" id="liveSay"></div>

<div class="palette" id="palette" hidden>
  <div class="pal-box" role="dialog" aria-modal="true" aria-label="{{t:Quick search}}">
    <div class="pal-head">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="palIn" type="text" autocomplete="off" spellcheck="false" placeholder="{{t:Search tasks, # for tags, > for commands}}" role="combobox" aria-expanded="true" aria-controls="palList">
    </div>
    <ul id="palList" role="listbox"></ul>
    <div class="pal-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> {{t:to select}}</span><span><kbd>Enter</kbd> {{t:to open}}</span><span><kbd>Esc</kbd> {{t:to close}}</span><span class="spacer"></span><span>{{t:Open with right}} <kbd>Shift</kbd> {{t:or}} <kbd>{{t:Ctrl}}</kbd> <kbd>K</kbd></span></div>
  </div>
</div>

<div class="end-veil" id="endVeil" hidden></div>

<script>/*__BOOT__*/</script>
<script>/*__JS__*/</script>
</body>
</html>
